version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: clicksoft_app
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - APP_KEY=your-app-key-here
      - DB_CONNECTION=pg
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=clicksoft_user
      - PG_PASSWORD=clicksoft_password
      - PG_DB_NAME=clicksoft_db
    networks:
      - clicksoft_network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3333/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: clicksoft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clicksoft_db
      POSTGRES_USER: clicksoft_user
      POSTGRES_PASSWORD: clicksoft_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clicksoft_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clicksoft_user -d clicksoft_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: clicksoft_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - clicksoft_network
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  clicksoft_network:
    driver: bridge